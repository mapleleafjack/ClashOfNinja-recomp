name: Build

# A tag publishes a release; every other event is a build check. The game itself cannot
# be built here — it needs the user's own disc image — so only the launcher is built, and
# only the launcher's windowless render tests run. `tools/check_publish.py` is the guard
# that nothing derived from the disc is in the tree being built.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bundle:
        description: Also build the full Windows bundle, which is normally release-only
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Publish gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nothing derived from the disc may be published
        run: python3 tools/check_publish.py

  macos:
    name: macOS (arm64)
    # macos-14 and later are Apple Silicon, which is what this build targets; macos-13
    # and earlier are Intel.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SDL2 statically
        shell: pwsh
        # Homebrew's SDL2 is a shared library, and a bundle linking it only runs on a
        # machine that has SDL2 installed. Build the pinned source instead, so the bundle
        # carries it and Windows and macOS build against the same version.
        run: |
          ./launcher/packaging/build-sdl2.ps1 -Prefix "$env:RUNNER_TEMP/sdl2"
          "SDL2_DIR=$env:RUNNER_TEMP/sdl2/lib/cmake/SDL2" >> $env:GITHUB_ENV

      - name: Configure
        run: >
          cmake -S launcher -B launcher/build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSDL2_DIR="$SDL2_DIR"
          -DNLA_VERSION="${{ steps.version.outputs.value }}"

      - name: Build
        # update_test is a ctest case of its own, so it has to exist before ctest runs.
        run: ninja -C launcher/build-ci NarutoLauncher update_test

      - name: Test
        run: ctest --test-dir launcher/build-ci --output-on-failure

      - name: No dynamic SDL2
        shell: bash
        run: |
          set -euo pipefail
          bin="launcher/build-ci/NarutoLauncher.app/Contents/MacOS/NarutoLauncher"
          if otool -L "$bin" | grep -qi sdl; then
            echo "::error::the bundle links SDL2 dynamically, so the download would need SDL2 installed"
            otool -L "$bin" | grep -i sdl
            exit 1
          fi
          echo "SDL2 is linked statically"

      - name: Bundle the build tools
        shell: bash
        run: |
          set -euo pipefail
          app="launcher/build-ci/NarutoLauncher.app"
          res="$app/Contents/Resources"

          # No game project is bundled: its symbol maps come off the disc, so a release
          # carries the launcher and the tools, and the player's own checkout is what the
          # launcher is pointed at.

          # CMake from the standalone tarball Kitware publishes. Only the `cmake` binary
          # and its module tree are copied: cpack, ctest, ccmake and the Qt GUI are 68 MB a
          # configure never runs, and everything else in the .app is the GUI's frameworks
          # and documentation. The bundle is arm64 only, so the universal binary is thinned
          # to the half that is used.
          cmake_version=3.30.5
          curl -fsSL -o "$RUNNER_TEMP/cmake.tar.gz" \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/cmake-${cmake_version}-macos-universal.tar.gz"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          cmake_app="$RUNNER_TEMP/cmake-${cmake_version}-macos-universal/CMake.app/Contents"
          mkdir -p "$res/tools/cmake/bin"
          lipo -thin arm64 "$cmake_app/bin/cmake" -output "$res/tools/cmake/bin/cmake"
          cp -R "$cmake_app/share" "$res/tools/cmake/share"

          # Ninja, and the same static SDL2 the launcher links, built above: with both in
          # place the game builds without Homebrew and without pkg-config.
          curl -fsSL -o "$RUNNER_TEMP/ninja.zip" \
            https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-mac.zip
          mkdir -p "$res/tools/ninja"
          ditto -x -k "$RUNNER_TEMP/ninja.zip" "$res/tools/ninja"
          lipo -thin arm64 "$res/tools/ninja/ninja" -output "$RUNNER_TEMP/ninja-arm64"
          mv "$RUNNER_TEMP/ninja-arm64" "$res/tools/ninja/ninja"
          chmod +x "$res/tools/ninja/ninja"
          cp -R "$RUNNER_TEMP/sdl2" "$res/tools/sdl2"

          # nodtool, for the image formats the launcher does not read itself.
          mkdir -p "$res/tools/nodtool"
          curl -fsSL -o "$res/tools/nodtool/nodtool" \
            https://github.com/encounter/nod/releases/download/v2.0.0-alpha.12/nodtool-macos-arm64
          chmod +x "$res/tools/nodtool/nodtool"

      - name: The bundled tools run
        shell: bash
        run: |
          set -euo pipefail
          res="launcher/build-ci/NarutoLauncher.app/Contents/Resources"
          "$res/tools/cmake/bin/cmake" --version | head -1
          "$res/tools/ninja/ninja" --version
          test -f "$res/tools/sdl2/lib/cmake/SDL2/SDL2Config.cmake"
          test ! -e "$res/project"

      - name: Sign ad hoc and package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          app="launcher/build-ci/NarutoLauncher.app"
          # Ad hoc, exactly like a local build, and after the sources and tools are in
          # place: the seal covers them, and on Apple silicon every executable inside the
          # bundle needs a signature of its own to run.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          stage="launcher/build-ci/package/Naruto Launcher ${version}"
          mkdir -p "$stage"
          ditto "$app" "$stage/Naruto Launcher.app"
          cp LICENSE THIRD-PARTY-NOTICES.md "$stage/"
          cp launcher/packaging/readme-macos.txt "$stage/README.txt"
          ditto licenses "$stage/licenses"

          zip="launcher/build-ci/NarutoLauncher-macOS-arm64-v${version}.zip"
          ditto -c -k --norsrc --keepParent "$stage" "$zip"
          shasum -a 256 "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: launcher/build-ci/NarutoLauncher-macOS-arm64-*.zip
          if-no-files-found: error

  windows:
    name: Windows (x64)
    # One job for both shapes, because a release run needs everything a compile check does:
    # every run configures, builds, tests and packages the launcher, and a release run also
    # writes the tool archive it downloads (about 190 MB, most of it MinGW-w64), checks that
    # download path against a server on the runner, and pins the published URL before
    # packaging. Two jobs used to build SDL2, the launcher and the tests separately.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Put MinGW-w64 on PATH
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build SDL2 for MinGW-w64
        shell: pwsh
        run: ./launcher/packaging/build-sdl2.ps1

      - name: Build the tools archive
        if: startsWith(github.ref, 'refs/tags/v') || inputs.bundle
        shell: pwsh
        run: |
          ./launcher/packaging/build-release.ps1 -SkipBuild -Zip -Split `
            -Version "${{ steps.version.outputs.value }}"

      - name: Name the archive and its digest
        # The launcher can only fetch the bytes it was built against, so the archive is
        # written first and its name, digest, size and published URL are recorded here.
        # A manual run has no release to point at and builds without the pin.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.bundle
        shell: pwsh
        run: |
          $zip = Get-ChildItem launcher/dist/NarutoLauncher-tools-windows-x64-*.zip |
            Select-Object -First 1
          "NLA_TOOLS_NAME=$($zip.Name)" >> $env:GITHUB_ENV
          "NLA_TOOLS_URL=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($zip.Name)" >> $env:GITHUB_ENV
          "NLA_TOOLS_SHA256=$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
          "NLA_TOOLS_BYTES=$($zip.Length)" >> $env:GITHUB_ENV

      - name: Serve the archive for the download check
        # The release that will hold this archive is written by the publish job, which runs
        # after this one, so the check below downloads it from the runner instead. The
        # shipped launcher is then built again with the published URL pinned.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.bundle
        shell: pwsh
        run: |
          # $env:GITHUB_ENV only reaches later steps, so the probe uses this variable.
          $url = "http://127.0.0.1:8741/$env:NLA_TOOLS_NAME"
          "NLA_CHECK_URL=$url" >> $env:GITHUB_ENV
          Start-Process python -WindowStyle Hidden -ArgumentList '-m','http.server',
            '8741','--bind','127.0.0.1','--directory',"$PWD/launcher/dist"
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing | Out-Null
              exit 0
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          throw "the local server did not answer at $url"

      - name: Configure
        run: >
          cmake -S launcher -B launcher/build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNLA_VERSION="${{ steps.version.outputs.value }}"
          -DNLA_TOOLS_URL="${{ env.NLA_CHECK_URL }}"
          -DNLA_TOOLS_SHA256="${{ env.NLA_TOOLS_SHA256 }}"
          -DNLA_TOOLS_BYTES="${{ env.NLA_TOOLS_BYTES }}"

      - name: Build
        run: ninja -C launcher/build-release NarutoLauncher update_test

      - name: Test
        run: ctest --test-dir launcher/build-release --output-on-failure

      - name: The pinned archive downloads and matches its digest
        if: startsWith(github.ref, 'refs/tags/v') || inputs.bundle
        shell: pwsh
        run: |
          # The launcher's own download path - WinHTTP, then the digest, then unpacking.
          $dir = Join-Path $env:RUNNER_TEMP 'fetch'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item launcher/build-release/NarutoLauncher.exe $dir
          $process = Start-Process -FilePath (Join-Path $dir 'NarutoLauncher.exe') `
            -ArgumentList '--fetch-tools', (Join-Path $dir 'fetch.log') -Wait -PassThru
          Get-Content (Join-Path $dir 'fetch.log')
          if ($process.ExitCode -ne 0) { throw "fetching the tools failed ($($process.ExitCode))" }
          if (-not (Test-Path (Join-Path $dir 'tools/mingw64/bin/g++.exe'))) {
            throw 'the tools archive did not unpack'
          }

      - name: Pin the published URL
        # The check above used this machine's copy; the launcher that ships points at the
        # release asset instead.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          cmake -S launcher -B launcher/build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DNLA_VERSION="${{ steps.version.outputs.value }}" `
            -DNLA_TOOLS_URL="$env:NLA_TOOLS_URL" `
            -DNLA_TOOLS_SHA256="$env:NLA_TOOLS_SHA256" `
            -DNLA_TOOLS_BYTES="$env:NLA_TOOLS_BYTES"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($LASTEXITCODE)" }
          ninja -C launcher/build-release NarutoLauncher
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      - name: No dynamic SDL2
        shell: bash
        run: |
          set -euo pipefail
          exe=launcher/build-release/NarutoLauncher.exe
          if objdump -p "$exe" | grep -qi 'DLL Name:.*SDL'; then
            echo "::error::the launcher links SDL2 dynamically, so it would need SDL2 beside it"
            objdump -p "$exe" | grep -i 'DLL Name:.*SDL'
            exit 1
          fi
          echo "SDL2 is linked statically"

      - name: Package the launcher
        shell: pwsh
        run: >
          ./launcher/packaging/build-release.ps1 -Lean -SkipBuild -Zip
          -Version "${{ steps.version.outputs.value }}"

      - name: The release carries nothing from the disc
        shell: pwsh
        run: |
          # The launcher and its tools ship; no game project and nothing derived from a
          # disc does, because a game folder's symbol maps come off the player's own copy.
          $out = Join-Path 'launcher/dist' 'NarutoLauncher'
          if (-not (Test-Path (Join-Path $out 'NarutoLauncher.exe'))) {
            throw 'the release is missing NarutoLauncher.exe'
          }
          foreach ($path in 'naruto', 'naruto2', 'gnt3', 'gnt4', 'config', 'covers') {
            if (Test-Path (Join-Path $out $path)) { throw "the release must not carry $path" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: launcher/dist/NarutoLauncher-Windows-x64-*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || inputs.bundle
        with:
          name: windows-tools
          path: launcher/dist/NarutoLauncher-tools-windows-x64-*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # One file per name: GitHub refuses a second upload of the same asset, so a stray
          # copy in another artifact's folder must not fail the release.
          mapfile -t assets < <(
            find dist -name '*.zip' -type f -printf '%f\t%p\n' | sort -u -k1,1 | cut -f2-)
          printf '%s\n' "${assets[@]}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
